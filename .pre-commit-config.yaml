# Install once with `pip install pre-commit && pre-commit install`.
# The hooks run only on staged files; `pre-commit run --all-files` is not expected to pass yet.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        name: ruff (lint)
        args: [--config, ruff.toml]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        types_or: [c++, cuda]
        args: [--dry-run, --Werror]
