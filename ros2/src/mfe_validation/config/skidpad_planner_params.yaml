/**:
  ros__parameters:
    registration_mode: "library"     # library | custom (launch sets this inline)
    gate: 1.5                        # custom: landmark-to-template match gate (m)
    min_match: 6
    max_resid: 0.5
    max_shift: 2.0                   # custom: max template shift (m)
    max_start_err_m: 2.0             # library: max start error (m)
    max_start_yaw_deg: 15.0          # library: max heading error (deg)
    max_reloc_rejects: 200           # library: give up after this many rejected fits
