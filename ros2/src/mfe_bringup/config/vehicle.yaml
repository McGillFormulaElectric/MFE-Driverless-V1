# MFE25 vehicle constants read by bringup.launch.py. The file is a ROS 2 parameter file for pure_pursuit_node;
# bringup passes it to that node, and the mission-dependent values are set on top of it in the launch file.
# The full vehicle specification (mass, powertrain, battery, aero, suspension) is in docs/vehicle.md.
pure_pursuit_node:
  ros__parameters:
    wheelbase: 1.56             # [m]     front-to-rear axle distance
    max_steering_deg: 28.0      # [deg]   physical URDF joint limit is ±29.8°
    max_lateral_accel: 8.0      # [m/s²]  corner speed: v = sqrt(a * R)
    max_deceleration: 10.0      # [m/s²]  braking deceleration
