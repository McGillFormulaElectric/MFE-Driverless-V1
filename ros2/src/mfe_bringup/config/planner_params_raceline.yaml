# Planner params for the race-line sim tests (raceline_enable: true, race line from lap 2)
# raceline_enable: follow a min-curvature race line from lap 2 (built from the lap-1 cone map).
path_planner_node:
  ros__parameters:
    pipeline_hysteresis: true
    jump_gate: true
    colour_vote: true
    cone_expiry: true
    planner_profile: true
    raceline_enable: true
    raceline_after_lap: 1
    raceline_extra_margin_m: 0.25
    raceline_a_lat: 6.0
    raceline_v_max: 8.0
    raceline_window_m: 35.0
